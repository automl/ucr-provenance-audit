name: UMD
archive:
- UCR
archive_type_tag: SIMULATED
n_train: 36
n_test: 144
series_length: 150
n_channels: 1
n_classes: 3
archive_page:
  description: 'UMD is a synthetic data set with 3 classes: one class is characterized by
    a small up bell arising at the initial or final period (Up); one does not have any bell
    (Middle); one has a small down bell arising at the initial or final period (Down).  -
    Class 1: Up - Class 2: Middle - Class 3: Down    Data source: University Joseph Fourier
    (Grenoble I), Laboratoire d’informatique de Grenoble(LIG), Equipe AMA'
  donated_by: Joseph Fourier University
  data_source_link: ''
  second_link: ''
original_problem:
  description: >
    No real-world problem exists. UMD is a synthetic three-class benchmark
    from the same donor as BME: a small bell appears near the start or the
    end of the series and the class is whether that bell points up (Up),
    is absent (Middle), or points down (Down). The archive page is the only
    account of the generator; no publication defining it was located.
  prediction_target: which of three generated shapes produced the series (up bell / no bell / down bell)
  input_as_originally_posed: synthetically generated signal
  task_family: synthetic-demo
  stakeholder_and_use: none (synthetic demo)
  source: >
    No publication found. The only provenance is the donor line on the
    archive page: "Data source: University Joseph Fourier (Grenoble I),
    Laboratoire d'informatique de Grenoble(LIG), Equipe AMA"
    (timeseriesclassification.com, UMD), with no data_source_link. As for
    BME, the likely origin is the Grenoble AMA group (candidate:
    Frambourg, Douzal-Chouakria & Gaussier, IDA 2013), but that text could
    not be reached (HAL access denied, ResearchGate 403) and no consulted
    source states UMD was introduced there.
  provenance_confidence: low

translation:
  transformation: [simulation]
  what_the_x_axis_is: index
  sampling: 150 generated points per series; no clock, no sampling rate is defined anywhere
  information_lost_or_added: n/a (generated directly in series form)
  label_semantics_changed: "no"

benchmark_task:
  description: Classify a univariate length-150 series as Up, Middle or Down.
  is_same_as_original: no-original-exists

verdict: synthetic
verdict_rationale: >
  Generated data with no underlying real-world task (task_family
  synthetic-demo, rule 1); the label is the shape the generator drew.
known_issues:
  - No publication defines the generating process; the archive text is the entire documentation.
  - Tiny train set (36 series, 3 classes) against 144 test series.
  - Near-duplicate design to BME (same donor, same "bell at the edge of the series" construction); the two are not independent benchmarks.
  - Some secondary sources report series length 151 for UMD while the archive ships 150; verify against the shipped files.

empirical:
  permutation_test:
    model: aeon 1.1.0 MiniRocketClassifier (default RidgeClassifierCV), default split
    acc_original: 0.9931
    acc_permuted: 0.9306
    drop: 0.0625
    permutation: one fixed permutation of the time axis, numpy default_rng(0), applied to train, test
      and all channels
    seed: 0
    variant: aeon default (_eq / _nmv when shipped)
    runtime_s: 5.3
    run: '2026-09-04'
  tabular_baseline:
    model: sklearn 1.6.1 HistGradientBoostingClassifier (defaults) vs the MiniRocket above
    acc_minirocket: 0.9931
    acc_raw_values: 0.3333
    acc_summary_stats: 0.3333
    summary_stats: 'per channel: mean, sd, min, max, q10, q25, q50, q75, q90, skew, kurtosis'
    gap_raw: 0.6597
    gap_summary: 0.6597
    seed: 0
    runtime_s: 3.3
    run: '2026-09-04'

references:
  - https://www.timeseriesclassification.com/description.php?Dataset=UMD
  - "Frambourg, Douzal-Chouakria, Gaussier, \"Learning Multiple Temporal Matching for Time Series Classification\", IDA 2013 (candidate origin; full text NOT reached)"

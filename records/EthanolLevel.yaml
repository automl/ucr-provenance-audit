  - 'Large, Kemsley, Wellner, Goodall, Bagnall, "Detecting Forged Alcohol Non-invasively Through Vibrational Spectroscopy and Machine Learning", PAKDD 2018, doi:10.1007/978-3-319-93034-3_24 (paywalled, not read)'

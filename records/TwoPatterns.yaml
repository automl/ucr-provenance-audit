name: TwoPatterns
archive:
- UCR
archive_type_tag: SIMULATED
n_train: 1000
n_test: 4000
series_length: 128
n_channels: 1
n_classes: 4
archive_page:
  description: "A simulated dataset generated by P. Geurts for his 2002 PhD thesis\n Contributions\
    \ to decision tree induction: bias/variance\ntradeoff and time series classification.\
    \  from the University\nof Liege.\n\nclass labels: 1: down-down (1306 cases) 2: up-down\
    \ (1248 cases) 3:\ndown-up (1245 cases) 4: up-up (1201 cases)"
  donated_by: P. Geurts
  data_source_link: http://orbi.ulg.ac.be/handle/2268/25737
  second_link: http://www.montefiore.ulg.ac.be/~geurts/thesis.html
original_problem:
  description: >
    No real-world problem exists. Pierre Geurts designed the "Two-pat"
    problem for the time-series part of his PhD thesis, to test whether a
    classifier can detect two local patterns and, crucially, their order.
    Each series is standard normal noise on the integer axis 0..127 into
    which two non-overlapping step patterns are inserted at random
    positions; each step is either upward or downward, and the class is
    the ordered pair of the two step types.
  prediction_target: the ordered pair of embedded step patterns (up-up, up-down, down-up, down-down)
  input_as_originally_posed: synthetically generated signal
  task_family: synthetic-demo
  stakeholder_and_use: none (synthetic demo)
  source: >
    Geurts, "Contributions to decision tree induction - bias/variance
    tradeoff and time series classification", PhD thesis, University of
    Liege, 2002, App. B.2.3 "Two-pat" (read, p. 237) - "This dataset has
    also be designed by us for our experiments. In this problem, each
    scenario is described by a single temporal input attribute A which is
    defined on the integer time axis 0,1,...,127"; the patterns are
    "s1 and s2 defining the patterns of respective lengths l1 and l2",
    "e(t) is some noise surrounding the patterns, drawn from a standard
    normal distribution N(0,1)", "l1 and l2 are integers uniformly drawn
    in [16;32]" and t1, t2 are drawn in [0;127] so that the two patterns do
    not overlap; the up/down steps take values -5 then +5 (us) or +5 then
    -5 (ds), each chosen with probability 0.5, and Eq. B.4 defines the four
    classes uu, ud, du, dd, which "are thus equiprobable".
  provenance_confidence: high

translation:
  transformation: [simulation]
  what_the_x_axis_is: index
  # The thesis calls it "the integer time axis 0..127"; there is no clock,
  # sampling rate or physical process behind it.
  sampling: 128 generated points per series
  information_lost_or_added: n/a (generated directly in series form)
  label_semantics_changed: "no"

benchmark_task:
  description: Classify a univariate length-128 series into the four ordered step-pair classes.
  is_same_as_original: no-original-exists

verdict: synthetic
verdict_rationale: >
  Generated data with no underlying real-world task (task_family
  synthetic-demo, rule 1); the label is the pair of shapes the generator
  inserted.
known_issues:
  - Step amplitude is +/-5 against N(0,1) noise, so the discriminative patterns are far above the noise floor; the problem is saturated (near-perfect accuracies are routine) and separates methods only at the third decimal.
  - Train and test (1000/4000) come from the same generator with the same parameters, so there is no distribution shift to test generalization against.
  - Class counts on the archive page (1306/1248/1245/1201) are near-balanced by construction, as the thesis states.

empirical:
  permutation_test:
    model: aeon 1.1.0 MiniRocketClassifier (default RidgeClassifierCV), default split
    acc_original: 0.9968
    acc_permuted: 0.7927
    drop: 0.204
    permutation: one fixed permutation of the time axis, numpy default_rng(0), applied to train, test
      and all channels
    seed: 0
    variant: aeon default (_eq / _nmv when shipped)
    runtime_s: 7.5
    run: '2026-09-04'
  tabular_baseline:
    model: sklearn 1.6.1 HistGradientBoostingClassifier (defaults) vs the MiniRocket above
    acc_minirocket: 0.9968
    acc_raw_values: 0.829
    acc_summary_stats: 0.3432
    summary_stats: 'per channel: mean, sd, min, max, q10, q25, q50, q75, q90, skew, kurtosis'
    gap_raw: 0.1678
    gap_summary: 0.6535
    seed: 0
    runtime_s: 4.6
    run: '2026-09-04'

references:
  - https://www.timeseriesclassification.com/description.php?Dataset=TwoPatterns
  - Geurts, PhD thesis, University of Liege, 2002 (read, App. B.2.3, p. 237) - https://people.montefiore.uliege.be/geurts/thesis.html
  - https://orbi.uliege.be/handle/2268/25737

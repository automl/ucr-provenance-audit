name: Lightning7
archive:
- UCR
archive_type_tag: SENSOR
n_train: 70
n_test: 73
series_length: 319
n_channels: 1
n_classes: 7
archive_page:
  description: 'The FORTE satellite detects transient electromagnetic events

    associated with lightning using a suite of optical and

    radio-frequency (RF) instruments. Data is collected with a sample

    rate of 50 MHz for 800 microseconds. A Fourier transform is

    performed on the input data to produce a spectrogram. The

    spectrograms are then collapsed in frequency to produce a power

    density time series, with 3181 samples in each time series. These

    are then smoothed to produce series of length 637. The seven

    classes are.


    CG Positive: Initial Return Stroke


    A positive charge is lowered from a cloud to the ground. The

    characteristic feature of this type of event in the power density

    time series is a sharp turn-on of radiation, followed by a few

    hundreds of microseconds of noise.


    IR Negative Initial Return Stroke


    A negative charge is lowered from a cloud to ground. The power

    waveform slowly ramps up to a level known as an attachment point,

    where a large surge current causes the VHF power to ''spike''. This

    attachment is followed by an exponentially shaped decline in the

    waveform.


    SR Subsequent Negative Return Stroke


    A negative charge is lowered from a cloud to ground. As the name

    implies, subsequent return strokes come after initial return

    strokes. Note that subsequent positive return strokes don''t exist.


    I Impulsive Event


    Typically an intra-cloud event characterized by a sudden peak in

    the waveform.


    I2 Impulsive Event Pair


    Another intra-cloud event characterized by sudden peaks in the

    waveform that come in closely separated pairs. These are also

    called TIPPs (Trans-Ionospheric Pulse Pairs).


    KM Gradual Intra-Cloud Stroke


    An intra-cloud event which increases in power more gradually than

    an impulsive event.


    O Off-record


    800 microseconds was not enough to fully capture the lightning

    event.'
  donated_by: D. Eads
  data_source_link: http://proceedings.spiedigitallibrary.org/proceeding.aspx?articleid=894463
  second_link: ''
original_problem:
  description: >
    The full-resolution version of the FORTE satellite transient-classification
    problem. FORTE recorded VHF electromagnetic transients associated with
    lightning; domain experts labelled each event with its physical type, and
    Los Alamos researchers (Eads and colleagues) used the resulting dataset to
    drive "Zeus", a genetic-programming feature extractor coupled to an SVM. The
    seven classes are physically meaningful discharge categories, spelled out at
    length on the archive page: positive initial return stroke, negative initial
    return stroke, subsequent negative return stroke, impulsive event, impulsive
    event pair (TIPP), gradual intra-cloud stroke, and off-record (events longer
    than the 800-microsecond capture window).
  prediction_target: >
    lightning transient type: CG Positive initial return stroke, IR negative
    initial return stroke, SR subsequent negative return stroke, I impulsive
    event, I2 impulsive event pair (TIPP), KM gradual intra-cloud stroke, O
    off-record
  input_as_originally_posed: >
    VHF radio-frequency waveform recorded by the FORTE satellite, 800
    microseconds sampled at 50 MHz
  task_family: remote-sensing
  # Satellite-borne instrument producing temporal profiles. The usual referent
  # of `remote-sensing` is earth-observation land profiles; here it is a
  # space-based RF receiver observing atmospheric discharges. Borderline fit,
  # flagged in the report, but closer than `other`.
  stakeholder_and_use: >
    atmospheric electricity research and treaty/nuclear-test monitoring
    programmes that must classify space-detected RF transients automatically
  source: >
    The archive description (quoted verbatim in `archive_page.description`
    above) is the donor's own account of both the preprocessing and the class
    physics: "Data is collected with a sample rate of 50 MHz for 800
    microseconds. A Fourier transform is performed on the input data to produce
    a spectrogram. The spectrograms are then collapsed in frequency to produce a
    power density time series, with 3181 samples in each time series. These are
    then smoothed to produce series of length 637." On the classes, e.g.: "IR
    Negative Initial Return Stroke... The power waveform slowly ramps up to a
    level known as an attachment point, where a large surge current causes the
    VHF power to 'spike'. This attachment is followed by an exponentially shaped
    decline in the waveform." and "O Off-record: 800 microseconds was not enough
    to fully capture the lightning event." The underlying study is Eads, Hill,
    Davis, Perkins, Ma, Porter & Theiler, Proc. SPIE 4787, 2002; it was read in
    November 2026 (Sec. 2.3: seven classes, 143 records; Sec. 4.1: ten-fold random
    cross-validation).
  provenance_confidence: medium

translation:
  transformation: [spectrum-as-series, resampling]
  # Chain: waveform -> spectrogram -> collapse over the frequency axis ->
  # smooth/decimate. The result is indexed by time but every value is an
  # integral over a spectrum.
  what_the_x_axis_is: time
  sampling: >
    Original acquisition: 50 MHz for 800 microseconds. After spectrogram
    formation and collapsing over frequency, 3181 power-density samples; the
    archive series for Lightning7 has 319 points spanning the same 800
    microseconds, i.e. about 2.5 microseconds per point.
  information_lost_or_added: >
    Collapsing the spectrogram over frequency discards the whole spectral
    dimension, including the dispersion signature that distinguishes some of the
    seven classes physically; phase is lost at the spectrogram step; smoothing
    and decimation to 319 points removes fine temporal detail. What survives is
    total radiated power versus elapsed microsecond, which is precisely the
    quantity the class descriptions on the archive page appeal to ("a sharp
    turn-on of radiation", "an exponentially shaped decline in the waveform").
  label_semantics_changed: "no"

benchmark_task:
  description: >
    Classify a length-319 power-density trace of a FORTE transient into one of
    seven expert-defined lightning event types.
  is_same_as_original: "yes"
  # Same expert labels, same representation as the source study used.

verdict: native-tsc
verdict_rationale: >
  A heavily processed power-density envelope, but indexed by elapsed
  microseconds within a real electromagnetic transient, and the class-defining
  features are explicitly temporal (turn-on sharpness, decay shape, pulse
  pairing).
known_issues:
  - >
    The primary source (Eads et al., Proc. SPIE 4787, 2002) was read in November
    2026. Sec. 2.3: "A total of 143 samples currently exist in the database"
    (= 70 + 73, the archive's total). Sec. 4.1: "Ten-fold cross-validation was
    used ... the lightning training data set was divided into ten equal
    randomly-chosen partitions." The archive's fixed 70/73 split is therefore not
    the source's evaluation protocol, and who built it and by what rule is undocumented. The class
    table notes that "subsequent return strokes come after initial return
    strokes", so strokes of one flash could fall on both sides of the split.
  - >
    Tiny and badly imbalanced: 70 train / 73 test across 7 classes (10 training
    instances per class on average), with a test default rate of 0.74. Single
    test errors move the reported accuracy by 1.4 points.
  - >
    The "O Off-record" class is defined by an instrument limitation (the 800
    microsecond window was too short), not by physics, so one of the seven
    labels describes the recorder rather than the event.
  - >
    Lightning2 and Lightning7 come from the same FORTE campaign and the same
    pipeline and are not independent datasets. How Lightning2's two classes
    relate to these seven is undocumented.
  - >
    Series length 319 here vs 637 for Lightning2, despite both archive pages
    giving the identical "smoothed to produce series of length 637" account —
    one of the two has undergone an extra, undocumented decimation.

empirical:
  permutation_test:
    model: aeon 1.1.0 MiniRocketClassifier (default RidgeClassifierCV), default split
    acc_original: 0.7945
    acc_permuted: 0.6712
    drop: 0.1233
    permutation: one fixed permutation of the time axis, numpy default_rng(0), applied to train, test
      and all channels
    seed: 0
    variant: aeon default (_eq / _nmv when shipped)
    runtime_s: 5.5
    run: '2026-09-04'
  tabular_baseline:
    model: sklearn 1.6.1 HistGradientBoostingClassifier (defaults) vs the MiniRocket above
    acc_minirocket: 0.7945
    acc_raw_values: 0.6301
    acc_summary_stats: 0.6027
    summary_stats: 'per channel: mean, sd, min, max, q10, q25, q50, q75, q90, skew, kurtosis'
    gap_raw: 0.1644
    gap_summary: 0.1918
    seed: 0
    runtime_s: 3.8
    run: '2026-09-04'

references:
- https://www.timeseriesclassification.com/description.php?Dataset=Lightning7
- >
  Eads, Hill, Davis, Perkins, Ma, Porter & Theiler, "Genetic algorithms and
  support vector machines for time series classification", Proc. SPIE 4787,
  Applications and Science of Neural Networks, Fuzzy Systems and Evolutionary
  Computation V, 2002, doi:10.1117/12.453526 — read in November 2026 (Sec. 2.3, 4.1, 5)
- Dau et al., "The UCR Time Series Archive", arXiv:1810.07758

name: SmoothSubspace
archive:
- UCR
archive_type_tag: SIMULATED
n_train: 150
n_test: 150
series_length: 15
n_channels: 1
n_classes: 3
archive_page:
  description: 'The data was originally intended for testing whether a clustering algorithm
    is able to extract smooth subspaces for clustering time series data [1].  There are 3
    classes corresponding to which cluster the time series belong to. Each time series contain
    a continuous subspace spanning over 5 continuous time stamps. - For cluster 1, it is from
    time stamp 1-5 - For cluster 2, it is from time stamp 6-10 - For cluster 3, it is from
    time stamp 11-15.  The rest of the time series are randomly generated.   Data created
    by Xiaohui Huang et al. (see [1]). Data edited by Hoang Anh Dau.  [1] Huang, Xiaohui,
    et al. "Time series k-means: A new k-means type smooth subspace clustering for time series
    data." Information Sciences 367 (2016): 1-13.'
  donated_by: X. Huang
  data_source_link: ''
  second_link: ''
original_problem:
  description: >
    No real-world problem exists. The data was generated by Huang et al.
    to test a clustering algorithm - specifically whether a k-means variant
    can recover "smooth subspaces", i.e. contiguous stretches of time
    stamps that carry the cluster signal while the remaining stamps are
    noise. Each length-15 series carries its discriminative window in five
    consecutive stamps (1-5, 6-10 or 11-15 for clusters 1, 2 and 3
    respectively) and is random elsewhere; UCR turned the generator's
    cluster identity into a supervised class label.
  prediction_target: which of three generated clusters (i.e. which 5-stamp window carries the signal) the series belongs to
  input_as_originally_posed: synthetically generated signal
  task_family: synthetic-demo
  stakeholder_and_use: none (synthetic demo)
  source: >
    Huang, Ye, Xiong, Lau, Jiang, Wang, "Time series k-means - A new
    k-means type smooth subspace clustering for time series data",
    Information Sciences 367-368 (2016) 1-13. The primary paper was NOT
    reached (ScienceDirect paywall, article S0020025516303796); the
    generator description comes from the archive page, which was written by
    the data editor and cites that paper - "The data was originally
    intended for testing whether a clustering algorithm is able to extract
    smooth subspaces for clustering time series data [1]. There are 3
    classes corresponding to which cluster the time series belong to. Each
    time series contain a continuous subspace spanning over 5 continuous
    time stamps. ... The rest of the time series are randomly generated.
    Data created by Xiaohui Huang et al. (see [1]). Data edited by Hoang
    Anh Dau."
  provenance_confidence: medium

translation:
  transformation: [simulation]
  what_the_x_axis_is: index
  sampling: 15 generated points per series; five consecutive indices carry the class signal
  information_lost_or_added: n/a (generated directly in series form)
  label_semantics_changed: "yes: the generator's cluster identity is reused as a supervised class label; the original use was unsupervised clustering"

benchmark_task:
  description: Classify a univariate length-15 series into the three generated cluster classes.
  is_same_as_original: different-task
  # Same generated groups, but the original task was clustering (recovering the
  # subspaces without labels); UCR poses supervised classification.

verdict: synthetic
verdict_rationale: >
  Generated data with no underlying real-world task (task_family
  synthetic-demo, rule 1); the label is the generator's cluster index.
known_issues:
  - Length 15 with a 5-point informative window - effectively a 15-feature tabular problem, and a positional (not shape) one, so order-aware models have little to exploit.
  - Class signal sits at fixed, class-specific positions, so a per-position mean is close to a sufficient statistic; near-ceiling accuracies are expected.
  - Generator noise model unverified - the primary paper is paywalled and the archive text is the only description.
  - Labels were designed as clustering ground truth; a supervised 150/150 split is a curator artifact.

empirical:
  permutation_test:
    model: aeon 1.1.0 MiniRocketClassifier (default RidgeClassifierCV), default split
    acc_original: 0.9533
    acc_permuted: 0.82
    drop: 0.1333
    permutation: one fixed permutation of the time axis, numpy default_rng(0), applied to train, test
      and all channels
    seed: 0
    variant: aeon default (_eq / _nmv when shipped)
    runtime_s: 5.3
    run: '2026-09-04'
  tabular_baseline:
    model: sklearn 1.6.1 HistGradientBoostingClassifier (defaults) vs the MiniRocket above
    acc_minirocket: 0.9533
    acc_raw_values: 0.9933
    acc_summary_stats: 0.9
    summary_stats: 'per channel: mean, sd, min, max, q10, q25, q50, q75, q90, skew, kurtosis'
    gap_raw: -0.04
    gap_summary: 0.0533
    seed: 0
    runtime_s: 3.1
    run: '2026-09-04'

references:
  - https://www.timeseriesclassification.com/description.php?Dataset=SmoothSubspace
  - Huang et al., Time series k-means, Information Sciences 367-368 (2016) 1-13, doi 10.1016/j.ins.2016.05.040 (primary, NOT reached - paywalled)

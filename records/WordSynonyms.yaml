name: WordSynonyms
archive:
- UCR
archive_type_tag: IMAGE
n_train: 267
n_test: 638
series_length: 270
n_channels: 1
n_classes: 25
archive_page:
  description: "This dataset consists of word profiles for George Washington's manuscripts.\
    \ \nThis dataset is the “50-words” dataset, remapped to 25 classes.\nThe data was flipped\
    \ left-right so that it would not be recognized."
  donated_by: T. Rath, R. Manmatha
  data_source_link: ''
  second_link: ''
original_problem:
  description: >
    The same George Washington word-image collection as FiftyWords, from Rath &
    Manmatha's work on word spotting in handwritten historical manuscripts. Their
    motivation (CVPR 2003, Sec. 1): "Traditional libraries contain an enormous
    amount of handwritten historical documents that they would like to make
    available electronically... such large collections can only be accessed
    efficiently if a searchable or browsable index exists." The archive page
    records what was done to make this variant: "This dataset is the '50-words'
    dataset, remapped to 25 classes. The data was flipped left-right so that it
    would not be recognized."
  prediction_target: which of 25 curator-defined word groups a word-image belongs to
  input_as_originally_posed: greyscale image of a segmented handwritten word on a manuscript page
  task_family: image-classification
  stakeholder_and_use: >
    libraries and archives wanting searchable indexes over handwritten
    collections (the 25-class regrouping has no counterpart in that use)
  source: >
    Rath & Manmatha, "Word image matching using dynamic time warping", CVPR 2003
    (read) for the underlying collection and representation. The regrouping to 25
    classes and the left-right flip are documented only on the archive page; no
    source explains which words were grouped together or on what criterion.
  provenance_confidence: medium

translation:
  transformation: [contour-unrolling, resampling, z-normalization]
  what_the_x_axis_is: position
  sampling: >
    One value per image column of the word image, resampled to 270 points, then
    reversed (the archive's left-right flip), so the series runs from the end of
    the word to its beginning.
  information_lost_or_added: >
    Same losses as FiftyWords (three of the four original per-column features
    dropped; no interior stroke structure). The left-right flip adds nothing but
    obfuscation - it was applied, per the archive page, "so that it would not be
    recognized" as the same data.
  label_semantics_changed: "yes: the source posed retrieval with no classes; the 50 words of FiftyWords, chosen afterwards, were merged into 25 groups, so a class is now a group of word types rather than one word"

benchmark_task:
  description: Classify a length-270 (reversed) word-profile series into one of 25 classes.
  is_same_as_original: different-task
  # Retrieval became classification, and the label set was then coarsened by the
  # curators into 25 groups.

verdict: translated-modality
verdict_rationale: >
  A scanned word image indexed by horizontal image position; the source modality
  is an image and the axis is spatial.
known_issues:
  - >
    The 25-class task is two steps removed from the source (checked 2026-11-04 against the
    FiftyWords source reading). Rath & Manmatha (CVPR 2003, Sec. 3.1-3.2) evaluated retrieval
    over "entire test set 1 (2381 images total ...)" and "entire test set 2 (3370 images
    total ...)": "each image in a data set is viewed as a query which is used to retrieve
    similar images from the entire collection", with words relevant "if they have the same
    tags". The paper has no 50-word subset, no fixed vocabulary and no classes. The 50 words of
    FiftyWords were carved out of that retrieval pool afterwards by an undocumented party
    (datasets/FiftyWords.yaml), and the archive then remapped them to 25 groups on an
    undocumented criterion.
  - 'Same 905 instances as FiftyWords (267+638 = 450+455), reversed and re-split; the two datasets are not independent, and archive-wide averages count this collection twice.'
  - 'Deliberate obfuscation: the archive states the series were flipped "so that it would not be recognized" - a documented case of a derived dataset presented as a separate problem.'
  - 'Grouping criterion for the 25 classes is undocumented; the name suggests synonymy, which is a semantic relation with no visual counterpart, so classes may be visually incoherent by construction.'
  - Single writer; class imbalance follows natural word frequency.

empirical:
  permutation_test:
    model: aeon 1.1.0 MiniRocketClassifier (default RidgeClassifierCV), default split
    acc_original: 0.7602
    acc_permuted: 0.6097
    drop: 0.1505
    permutation: one fixed permutation of the time axis, numpy default_rng(0), applied to train, test
      and all channels
    seed: 0
    variant: aeon default (_eq / _nmv when shipped)
    runtime_s: 5.9
    run: '2026-09-04'
  tabular_baseline:
    model: sklearn 1.6.1 HistGradientBoostingClassifier (defaults) vs the MiniRocket above
    acc_minirocket: 0.7602
    acc_raw_values: 0.5329
    acc_summary_stats: 0.2759
    summary_stats: 'per channel: mean, sd, min, max, q10, q25, q50, q75, q90, skew, kurtosis'
    gap_raw: 0.2273
    gap_summary: 0.4843
    seed: 0
    runtime_s: 5.8
    run: '2026-09-04'

references:
  - https://www.timeseriesclassification.com/description.php?Dataset=WordSynonyms
  - https://www.timeseriesclassification.com/description.php?Dataset=FiftyWords
  - Rath & Manmatha, "Word image matching using dynamic time warping", CVPR 2003 - http://ciir-publications.cs.umass.edu/pdf/MM-38.pdf

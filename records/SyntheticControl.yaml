name: SyntheticControl
archive:
- UCR
archive_type_tag: SIMULATED
n_train: 300
n_test: 300
series_length: 60
n_channels: 1
n_classes: 6
archive_page:
  description: "This dataset contains 600 examples of control charts synthetically\ngenerated\
    \ by the process in the paper   Time-Series Similarity\nQueries Employing a Feature-Based\
    \ Approach . There are six\ndifferent classes of control charts:\n\n 1. Normal\n 2. Cyclic\n\
    \ 3. Increasing trend\n 4. Decreasing trend\n 5. Upward shift\n 6. Downward shift"
  donated_by: R. Alcock , Y. Manolopoulos
  data_source_link: https://archive.ics.uci.edu/ml/datasets/Synthetic+Control+Chart+Time+Series
  second_link: http://rexa.inf
original_problem:
  description: >
    No real measurements exist. The six classes imitate the pattern
    vocabulary of statistical process control - the shapes a quality
    engineer is trained to spot on a manufacturing control chart (in
    control, cyclic, trending up/down, shifted up/down). R. J. Alcock
    generated 600 charts from closed-form equations to test the
    feature-based similarity method of Alcock and Manolopoulos (1999) and
    donated them to the UCI KDD Archive.
  prediction_target: which of six control-chart pattern classes the generator drew
  input_as_originally_posed: synthetically generated control-chart trace
  task_family: synthetic-demo
  stakeholder_and_use: >
    none (synthetic demo). The class vocabulary is borrowed from
    control-chart pattern recognition in manufacturing quality control -
    whose real users would be process/quality engineers - but no process
    was ever measured; the UCI page cites Pham and Chan (1998) on
    control-chart pattern recognition as background.
  source: >
    UCI KDD Archive dataset page (read), which names the generator - "Original
    Owner and Donor Dr Robert Alcock ... Date Donated - June 8, 1999. Data
    Characteristics - This dataset contains 600 examples of control charts
    synthetically generated by the process in Alcock and Manolopoulos
    (1999). ... The classes are organized as follows - 1-100 Normal,
    101-200 Cyclic, 201-300 Increasing trend, 301-400 Decreasing trend,
    401-500 Upward shift, 501-600 Downward shift". The primary conference
    paper (Alcock and Manolopoulos, 7th Hellenic Conference on Informatics,
    Ioannina 1999) was NOT reached, but its generating equations are
    reproduced in Geurts (2002) PhD thesis, App. B.2.4 "CC" (read - taking
    m = 30, s = 2 and r(t) uniform on [-3,3], Normal is m + s*r(t), Cyclic
    adds a*sin(2*pi*t/T) with a and T drawn in [10,15], Increasing adds g*t
    with g in [0.2,0.5], Upward adds a step x in [7.5,20] at a random time
    in [n/3, 2n/3], and the down-variants negate these).
  provenance_confidence: medium

translation:
  transformation: [simulation]
  what_the_x_axis_is: index
  # The generator defines t on the discrete interval [1,60] and calls it time,
  # but no physical clock or sampling rate exists; the index is the only axis.
  sampling: 60 generated points per series; the generating equations are functions of a discrete step t in [1,60]
  information_lost_or_added: n/a (generated directly in series form)
  label_semantics_changed: "no"

benchmark_task:
  description: Classify a univariate length-60 series into the six control-chart pattern classes.
  is_same_as_original: no-original-exists

verdict: synthetic
verdict_rationale: >
  Data generated from closed-form equations to demonstrate a similarity
  method (task_family synthetic-demo, rule 1); the SPC framing is imitated,
  not measured.
known_issues:
  - Classes are deliberately confusable in pairs; the UCI KDD clustering page states "the following pairs of classes will often be confused (Normal/Cyclic) (Decreasing trend/Downward shift) and (Increasing trend/ Upward shift)".
  - The UCR 300/300 split is a partition of the same 600 generated UCI examples, so train and test come from one generator run with identical parameters.
  - Easy and saturated - modern classifiers sit near the ceiling, so the dataset carries little discriminative information in a benchmark.

empirical:
  permutation_test:
    model: aeon 1.1.0 MiniRocketClassifier (default RidgeClassifierCV), default split
    acc_original: 0.9867
    acc_permuted: 0.92
    drop: 0.0667
    permutation: one fixed permutation of the time axis, numpy default_rng(0), applied to train, test
      and all channels
    seed: 0
    variant: aeon default (_eq / _nmv when shipped)
    runtime_s: 6.3
    run: '2026-09-04'
  tabular_baseline:
    model: sklearn 1.6.1 HistGradientBoostingClassifier (defaults) vs the MiniRocket above
    acc_minirocket: 0.9867
    acc_raw_values: 0.8767
    acc_summary_stats: 0.3867
    summary_stats: 'per channel: mean, sd, min, max, q10, q25, q50, q75, q90, skew, kurtosis'
    gap_raw: 0.11
    gap_summary: 0.6
    seed: 0
    runtime_s: 3.7
    run: '2026-09-04'

references:
  - https://www.timeseriesclassification.com/description.php?Dataset=SyntheticControl
  - https://archive.ics.uci.edu/ml/datasets/Synthetic+Control+Chart+Time+Series
  - UCI KDD Archive pages synthetic_control.data.html and synthetic_control.clustering.html (shipped inside the UCI download; read)
  - Alcock and Manolopoulos, Time-Series Similarity Queries Employing a Feature-Based Approach, 7th Hellenic Conference on Informatics, Ioannina 1999 (primary, NOT reached)
  - Geurts, PhD thesis, Univ. de Liege 2002, App. B.2.4 (read; reproduces the generating equations)

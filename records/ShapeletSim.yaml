name: ShapeletSim
archive:
- UCR
archive_type_tag: SIMULATED
n_train: 20
n_test: 180
series_length: 500
n_channels: 1
n_classes: 2
archive_page:
  description: Shapelet Sim is a simulated dataset designed for Shapelets. One of five shapes
    is embedded in a random position in white noise. The shapes are TRIANGLE,HEADSHOULDERS,SINE,
    STEP, SPIKE. More random data can be generated with the class SimulateShapeletDataset
  donated_by: J. Hills, A. Bagnall
  data_source_link: ''
  second_link: ''
original_problem:
  description: >
    No real-world problem exists. ShapeletSim was generated by the UEA
    group (J. Hills, A. Bagnall) as a probe for shapelet algorithms - a
    class is defined purely by the presence of one short discriminative
    shape inserted at a random position in white noise, which is the
    idealized situation shapelet methods are built for and the situation
    whole-series (vector and interval) methods are expected to fail on.
  prediction_target: which of two embedded shapes (shapelets) the series contains
  input_as_originally_posed: synthetically generated signal
  task_family: synthetic-demo
  stakeholder_and_use: none (synthetic demo)
  source: >
    Bagnall, Lines, Vickers et al., "Simulated Data Experiments for Time
    Series Classification Part 1 - Accuracy Comparison with Default
    Settings", arXiv:1703.09480, Sec. 5 "Shapelet Simulator" (read) -
    "A shapelet is a discriminatory pattern embedded in a series.
    Currently this simulator only works for a single shapelet defining a
    class. Each model randomly chooses a shapelet from those described in
    Figure ??. The shapelet is placed at a random location for each series
    from that model (by the call to generateSeries(int length)), embedded
    in noise." The design intent is stated in Sec. 5.1 - "we think vector
    based classifiers would be poor at these data, because the random
    location of the discriminatory shape should confound them ... shapelet
    classifiers should be the best". The archive page names the same
    generator class (SimulateShapeletDataset) and the shape library
    (TRIANGLE, HEADSHOULDERS, SINE, STEP, SPIKE). Hills, Lines,
    Baranauskas, Mapp, Bagnall, "Classification of time series by shapelet
    transformation", DMKD 28(4), 2014 - the paper the donors are known for -
    was NOT reached (the CORE mirror returned HTTP 522, the Springer copy
    is paywalled), so the parameters used for the archived copy in
    particular are undocumented.
  provenance_confidence: medium

translation:
  transformation: [simulation]
  what_the_x_axis_is: index
  sampling: 500 generated points per series, one shape inserted at a uniformly random offset
  information_lost_or_added: n/a (generated directly in series form)
  label_semantics_changed: "no"

benchmark_task:
  description: Classify a univariate length-500 series by which embedded shape it contains (2 classes).
  is_same_as_original: no-original-exists

verdict: synthetic
verdict_rationale: >
  Generated data with no underlying real-world task (task_family
  synthetic-demo, rule 1); the label is which shape the simulator inserted.
known_issues:
  - Built to favour one algorithm family - Bagnall et al. state the prior belief that vector and interval classifiers should fail and shapelet classifiers should win, so accuracy here measures shapelet-friendliness, not task difficulty.
  - Only 20 train series (2 classes) against 180 test series; single-run generated split.
  - The exact generator parameters of the shipped copy (which two of the five shapes, shape length, noise level) are not documented anywhere consulted; the simulator paper's defaults (series length 300, shapelet length 29, 50+50 cases) do not match the archived 500/20/180 copy.

empirical:
  permutation_test:
    model: aeon 1.1.0 MiniRocketClassifier (default RidgeClassifierCV), default split
    acc_original: 1.0
    acc_permuted: 0.4833
    drop: 0.5167
    permutation: one fixed permutation of the time axis, numpy default_rng(0), applied to train, test
      and all channels
    seed: 0
    variant: aeon default (_eq / _nmv when shipped)
    runtime_s: 5.4
    run: '2026-09-04'
  tabular_baseline:
    model: sklearn 1.6.1 HistGradientBoostingClassifier (defaults) vs the MiniRocket above
    acc_minirocket: 1.0
    acc_raw_values: 0.5
    acc_summary_stats: 0.5
    summary_stats: 'per channel: mean, sd, min, max, q10, q25, q50, q75, q90, skew, kurtosis'
    gap_raw: 0.5
    gap_summary: 0.5
    seed: 0
    runtime_s: 6.0
    run: '2026-09-04'

references:
  - https://www.timeseriesclassification.com/description.php?Dataset=ShapeletSim
  - Bagnall et al., Simulated Data Experiments for Time Series Classification Part 1, arXiv:1703.09480 (read, Sec. 5)
  - Hills, Lines, Baranauskas, Mapp, Bagnall, Classification of time series by shapelet transformation, DMKD 28(4) 2014 (NOT reached - CORE mirror HTTP 522, Springer paywalled)

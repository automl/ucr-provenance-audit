name: LargeKitchenAppliances
archive:
- UCR
archive_type_tag: DEVICE
n_train: 375
n_test: 375
series_length: 720
n_channels: 1
n_classes: 3
archive_page:
  description: These problems were taken from data recorded as part of government sponsored
    study called Powering the Nation. The intention was to collect behavioural data about
    how consumers use electricity within the home to help reduce the UK's carbon footprint.
    The data contains readings from 251 households, sampled in two-minute intervals over a
    month. Each series is length 720 (24 hours of readings taken every 2 minutes). Classes
    are Washing Machine (1), Tumble Dryer (2) and Dishwasher (3).
  donated_by: J. Lines, A. Bagnall
  data_source_link: https://www.uea.ac.uk/computing/machine-learning/elastic-ensembles
  second_link: ''
original_problem:
  description: >
    The data come from the UK Household Electricity Survey (HES; DECC, Defra
    and the Energy Saving Trust, 2010-2011), a government study of domestic
    electricity use in owner-occupier homes in England: "The intention was to
    collect behavioural data about how consumers use electricity within the
    home to help reduce the UK's carbon footprint" (Lines 2015 thesis, Sec.
    3.2.2, p. 41). Electricians fitted wattmeters to individual appliances and
    to some groups of appliances (Intertek final report, Sec. 2, p. 54).
    Lines & Bagnall (UEA) then posed five appliance-classification problems
    from these recordings: "We provide five new classification problems that
    focus on domestic appliance classification from electricity consumption"
    (thesis p. 41, Table 3.3); "These datasets were introduced into the
    literature in [75]" (Lines & Bagnall, SDM 2014). The five are Computers,
    LargeKitchenAppliances, RefrigerationDevices, ScreenType and
    SmallKitchenAppliances. ElectricDevices is not one of them: it comes from
    a different study, GEO's Visual Energy Trial (thesis Sec. 3.2, p. 38: the
    household device datasets "arise from two different sources").
  prediction_target: which large kitchen appliance produced the day's consumption trace (washing machine, tumble dryer, dishwasher)
  input_as_originally_posed: one day of a wattmeter's readings on a washing machine, tumble dryer or dishwasher in a surveyed home
  task_family: device-monitoring
  stakeholder_and_use: >
    The survey served UK energy policy (gov.uk HES collection page). The
    curators' stated aim was to extract more information from smart-meter
    data by "classifying appliances according to their electricity usage
    profiles" (thesis p. 41). The benchmark gives an appliance trace that was
    already metered on its own, so it is appliance recognition, not
    disaggregation of a whole-house load.
  source: >
    J. Lines, "Time Series Classification through Transformation and
    Ensembles", PhD thesis, UEA, 2015, Sec. 3.2.2 and Table 3.3 (pp. 41-42);
    Lines & Bagnall, "Ensembles of elastic distance measures for time series
    classification", SIAM SDM 2014, pp. 524-532 (introduces the five problems;
    not read, no full text found); the survey: Intertek Report R66141,
    "Household Electricity Survey: A study of domestic electrical product
    usage", final report issue 4. Bagnall et al. 2017 (bake-off, Sec. 6.2)
    attribute the problems to Lines & Bagnall 2015 (DMKD; not read).
  provenance_confidence: high
  # High for the original problem: the curators' thesis documents the source
  # survey, the five problems and their classes. Not resolved: which
  # households, appliances and days were selected, the split rule, and (for
  # LargeKitchenAppliances) the numeric class codes; see known_issues.
translation:
  transformation:
  - windowing
  - z-normalization
  what_the_x_axis_is: time
  sampling: >
    720 readings at 2-minute intervals, 24 hours per series (archive page:
    "Each series is length 720 (24 hours of readings taken every 2
    minutes)"). Whether each window starts at midnight is not documented.
  information_lost_or_added: >
    Each series is one day cut from a month (or, for some households, a year)
    of metering, so context across days is lost and one appliance can supply
    many series. The series are z-normalized (Dau et al. 2019, Sec. III-C:
    "The time series are already z-normalized to remove offset and scaling";
    measured 2026-11-02: every series has mean 0 and standard deviation 1), so
    absolute power level and scale are removed.
  label_semantics_changed: "no"
  # Under settled policy L3 the survey's appliance annotations are the source
  # task; the curators kept those appliance categories as classes.
benchmark_task:
  description: >
    Classify a 720-point daily consumption profile as washing machine, tumble dryer or dishwasher.
  is_same_as_original: "yes"
  # The curators posed this classification problem themselves (thesis Sec.
  # 3.2.2, Table 3.3); the archive ships it unchanged apart from the split.
verdict: native-tsc
verdict_rationale: >
  Metered electricity consumption on a real time axis, with appliance classes
  posed by the curators from the survey's own appliance annotations. The
  curators chose the classes, the cases, the daily windows and the
  normalization.
known_issues:
- >
  Five datasets share the survey as their source: Computers,
  LargeKitchenAppliances, RefrigerationDevices, ScreenType and
  SmallKitchenAppliances (thesis Sec. 3.2.2, Table 3.3). No source says
  whether they share households or appliances; no series is repeated across
  the five (measured 2026-11-02). Inference: treating them as five
  independent results may overstate the evidence, but how dependent they are
  is not measured.
- >
  Which households and days were used is not documented. The archive page
  and the thesis say 251 households sampled every 2 minutes over a month;
  Intertek (p. 24) also says 251, while HES Report 5 (p. 4) and the gov.uk
  page say 250. The 26 year-long households were recorded at 10-minute
  intervals except from the end of November 2010 to the February 2011 visit,
  when they recorded at 2-minute intervals (Intertek p. 64). Report 5's
  summary ("10-minute intervals for the households participating for a
  year") simplifies this.
- >
  Split: the curators state that from the earlier ElectricDevices work "we
  found that if consumption data from a specific device in a given household
  were included in both the training and testing data, bias was introduced
  into classification results", and that this influenced the creation of
  these datasets (thesis p. 41; also Sec. 5.1, p. 64: some datasets "have been
  split in a certain manner to avoid introducing bias", naming these). They
  do not state the rule used here, and the archive files carry no household
  or device identifiers. (The household-exclusive rule in thesis Sec. 3.2.1
  is stated for the Visual Energy Trial only.) Measured 2026-11-02:
  750 unique series, no exact duplicates within or across the split; 125 series per class in each split; 1-NN Euclidean accuracy 0.493 on the shipped split vs 0.530 mean (0.477-0.581) over 30 random class-stratified re-splits. Inference: this
  is consistent with the split keeping devices apart, but does not show it.
- >
  Labels: for every monitored product the installing electricians filled in
  a spreadsheet with the appliance "selected from a dropdown list" (Intertek
  Sec. 3.4, pp. 59-60). How those entries became the archive's classes is not
  documented. The survey also metered some appliances in groups, e.g.
  "computer sites which usually comprised a PC with any items such screens
  and printers which were always switched on when the PC was used" (Intertek
  p. 54, footnote 12); whether grouped channels entered this dataset is not
  documented.
- >
  Class codes conflict. The archive page gives "Washing Machine (1), Tumble
  Dryer (2) and Dishwasher (3)"; the bake-off's Fig. 17 caption (Bagnall et
  al. 2017, Sec. 6.2) gives "Washing Machine (class 3), ... Tumble Dryers
  (class 2) and ... Dishwashers (class 1)". The thesis (Table 3.3) lists the
  names without codes, and the shipped files cannot settle it.
- >
  The curators put this among the problems "with dissimilar usage patterns",
  meant to be "well suited to time-domain classification" (thesis p. 41). The
  bake-off (Sec. 6.2) describes "periods of inactivity followed by spikes when
  the device is in use" and reports that shapelet methods reach 90-95%
  accuracy over its resamples (not the fixed split alone).
empirical:
  permutation_test:
    model: aeon 1.1.0 MiniRocketClassifier (default RidgeClassifierCV), default split
    acc_original: 0.8747
    acc_permuted: 0.7733
    drop: 0.1013
    permutation: one fixed permutation of the time axis, numpy default_rng(0), applied to train, test
      and all channels
    seed: 0
    variant: aeon default (_eq / _nmv when shipped)
    runtime_s: 8.4
    run: '2026-09-04'
  tabular_baseline:
    model: sklearn 1.6.1 HistGradientBoostingClassifier (defaults) vs the MiniRocket above
    acc_minirocket: 0.8747
    acc_raw_values: 0.6053
    acc_summary_stats: 0.7307
    summary_stats: 'per channel: mean, sd, min, max, q10, q25, q50, q75, q90, skew, kurtosis'
    gap_raw: 0.2693
    gap_summary: 0.144
    seed: 0
    runtime_s: 5.5
    run: '2026-09-04'

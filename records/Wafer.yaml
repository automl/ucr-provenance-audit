  Olszewski, "Generalized Feature Extraction for Structural Pattern Recognition
  in Time-Series Data", PhD thesis, Carnegie Mellon University, CMU-CS-01-108,
  2001, Sec. 4.3.2 pp.65-70, Tables 4.3-4.4; https://www.cs.cmu.edu/~bobski/pubs/tr01108-twosided.pdf
